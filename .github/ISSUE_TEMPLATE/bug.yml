name: Bug report
description: A pod command or agent did the wrong thing or stopped.
labels: [bug]
body:
  - type: input
    id: pod-version
    attributes:
      label: pod version
      description: Run `claude plugin list` in a shell. Add the pod-flow version if you use it.
      placeholder: pod X.Y.Z · pod-flow X.Y.Z
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: Command
      options:
        - /pod:autopilot
        - /pod:code
        - /pod:create-wave-prompts
        - /pod:idea
        - /pod:init
        - /pod:plan
        - /pod:report
        - /pod:research
        - /pod:ship
        - /pod:sprint
        - /pod:task
        - /pod:teach
        - pod-flow hooks
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The step where it stopped or did the wrong thing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The project setup and what you typed. Say if the repo has CI.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or hand-back text
      description: The agent reply, hand-back, or error. Remove secrets first.
      render: shell
