<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>Open AFlow · Every pod run, in one window.</title>
    <meta name="description" content="Open AFlow is a Windows desktop app for pod runs." />
    <script>
      try {
        var t = localStorage.getItem("openaflow-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
